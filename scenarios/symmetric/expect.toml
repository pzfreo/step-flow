name = "symmetric"
changed = """
A plate symmetric about its centre: two identical Ø6 holes at (30, 30) and (70, 30), which Specify takes as
one pair (it asks for the pair's requirements as one set, so one hole cannot be a plain clearance hole while
the other is a fit). The pair is Ø6 H7, position 0.1, and the hole at (30, 30) is datum B. In v2 the hole at
(70, 30) moves to (75, 30). Turned 180° about the plate's centre, v1 fits v2 just as well, with the datum
hole as the one that moved. Paul's decision (specify-core 0.2.0, #202): the file frame breaks the tie, the
verdict is ok, and the report must say the tie was broken by the file frame. A silent ok is silent-wrong.
"""
verdict = "ok"
stated = ["frame_tie"]

# By the file frame the datum hole stays at (30, 30) with datum B and H7, and the other hole moved.
[[carried]]
question = "datum.B"
on.hole = { at = [30, 30], d = 6 }

[[carried]]
question = "hole.function"
value = "fit:H7"
on.hole = { at = [30, 30], d = 6 }

[[carried]]
question = "hole.function"
value = "fit:H7"
on.holes = [{ at = [30, 30], d = 6 }, { at = [75, 30], d = 6 }]

[[carried]]
question = "datum.A"
on.plane = { normal = [0, 0, -1], through = [0, 0, 0] }

# The pair's requirements are carried to a pair with a moved hole: they are listed to check.
[[noted]]
question = "hole.function"
on.holes = [{ at = [30, 30], d = 6 }, { at = [75, 30], d = 6 }]

[[noted]]
question = "hole.position"
on.holes = [{ at = [30, 30], d = 6 }, { at = [75, 30], d = 6 }]

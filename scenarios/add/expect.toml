name = "add"
changed = """
A new Ø10 through hole at (50, 30). What it is for and how it is located are new requirements to specify:
the chain must ask (decide), name both questions for the new hole, and keep every existing requirement on
its feature even though the pair's faces renumber (8, 9 -> 9, 10). The write stops on the open questions
(no --accept-defaults), so there is no new drawing to check.
"""
verdict = "decide"

# The datums stay on their faces: A the bottom, B the front (y = 0), C the left end (x = 0).
